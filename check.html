<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Arcade — self check</title>
<style>
  body { margin: 0; padding: 20px; background: #0e0c1e; color: #e6ecf5; font: 15px/1.5 system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 6px; color: #74b9ff; }
  .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
  .ok { color: #7fe0a0; } .bad { color: #ff6b6b; font-weight: 700; } .warn { color: #ffd36b; }
  code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px; }
  #fails div { font-family: ui-monospace, monospace; font-size: 13px; }
  button { background: #74b9ff; color: #0e0c1e; border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
  textarea { width: 100%; height: 120px; background: #06050f; color: #cfe; border: 1px solid #333; border-radius: 8px; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<h1>Neon Arcade — self check</h1>
<div>Loads every game script the same way the arcade does and reports what breaks on <em>this</em> computer.</div>

<div class="card"><b>Browser</b><div id="ua"></div></div>
<div class="card"><b>Scripts</b><div id="scripts">loading…</div><div id="fails"></div></div>
<div class="card"><b>Games registered</b><div id="games"></div></div>
<div class="card"><b>Runtime errors</b><div id="errs">none yet</div></div>
<div class="card"><b>Speed</b><div id="speed">measuring…</div></div>
<div class="card"><b>Copy this to George's Claude</b><br><textarea id="report" readonly></textarea><br><button onclick="copyReport()">Copy report</button></div>

<script>
(function () {
  const out = { ua: navigator.userAgent, loaded: [], failed: [], errors: [], games: [], kid: [], fps: null, draw: null };
  const $ = (id) => document.getElementById(id);
  $("ua").textContent = navigator.userAgent + " · " + screen.width + "×" + screen.height + " · dpr " + (window.devicePixelRatio || 1) + " · cores " + (navigator.hardwareConcurrency || "?") + " · touch " + (navigator.maxTouchPoints || 0);
  window.addEventListener("error", function (e) { out.errors.push((e.filename || "").split("/").pop() + ":" + e.lineno + " " + e.message); render(); });

  function render() {
    $("scripts").innerHTML = "<span class='ok'>" + out.loaded.length + " loaded</span>" + (out.failed.length ? " · <span class='bad'>" + out.failed.length + " FAILED</span>" : "");
    $("fails").innerHTML = out.failed.map((f) => "<div class='bad'>✗ " + f + "</div>").join("");
    const g = window.Arcade && Arcade.games ? Arcade.games : [];
    out.games = g.map((x) => x.id); out.kid = g.filter((x) => x.kid || x.kidOpts).map((x) => x.id);
    $("games").innerHTML = g.length + " games · kid hub: " + out.kid.length + " <br><small>" + out.kid.join(", ") + "</small>";
    $("errs").innerHTML = out.errors.length ? out.errors.map((e) => "<div class='bad'>" + e + "</div>").join("") : "<span class='ok'>none</span>";
    if (out.fps !== null) $("speed").innerHTML = (out.fps < 30 ? "<span class='bad'>" : out.fps < 50 ? "<span class='warn'>" : "<span class='ok'>") + out.fps + " fps</span> on a heavy canvas test (glow-heavy, like the games) · plain draw " + out.draw + " ms/frame";
    $("report").value = JSON.stringify(out, null, 1);
  }
  window.copyReport = function () { $("report").select(); document.execCommand("copy"); };

  // 1) pull the live index.html and load its scripts in order, tracking failures
  fetch("index.html", { cache: "no-store" }).then((r) => r.text()).then((html) => {
    const srcs = []; const re = /<script src="([^"]+)"><\/script>/g; let m; while ((m = re.exec(html))) srcs.push(m[1]);
    let i = 0;
    function next() {
      if (i >= srcs.length) { render(); bench(); return; }
      const src = srcs[i++]; const s = document.createElement("script"); s.src = src;
      s.onload = function () { out.loaded.push(src); render(); next(); };
      s.onerror = function () { out.failed.push(src + " (did not load)"); render(); next(); };
      document.head.appendChild(s);
    }
    next();
  }).catch((e) => { $("scripts").innerHTML = "<span class='bad'>could not fetch index.html: " + e + "</span>"; bench(); });

  // 2) canvas speed: 3 s of glow-heavy drawing, then plain drawing
  function bench() {
    const c = document.createElement("canvas"); c.width = c.height = 600; const g = c.getContext("2d");
    let frames = 0, t0 = performance.now();
    function heavy() {
      g.clearRect(0, 0, 600, 600);
      for (let k = 0; k < 60; k++) { g.shadowColor = "#7fe0a0"; g.shadowBlur = 20; g.fillStyle = "hsl(" + (k * 6) + ",80%,60%)"; g.beginPath(); g.arc(300 + Math.cos(k + frames * 0.05) * 200, 300 + Math.sin(k * 1.3 + frames * 0.05) * 200, 18, 0, 6.283); g.fill(); }
      frames++;
      if (performance.now() - t0 < 3000) requestAnimationFrame(heavy);
      else { out.fps = Math.round(frames / 3); const a = performance.now(); for (let f = 0; f < 30; f++) { g.shadowBlur = 0; for (let k = 0; k < 300; k++) { g.fillStyle = "#74b9ff"; g.fillRect((k * 37) % 600, (k * 53) % 600, 8, 8); } } out.draw = ((performance.now() - a) / 30).toFixed(2); render(); }
    }
    requestAnimationFrame(heavy);
  }
})();
</script>
</body>
</html>
